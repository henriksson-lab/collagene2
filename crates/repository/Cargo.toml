[package]
name = "collagene-repository"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Durable offline plasmid repository with explicit retry-safe remote synchronization"

[dependencies]
collagene-model = { path = "../model" }
collagene-core = { path = "../core" }
collagene-lab-library = { path = "../lab-library" }
collagene-library-protocol = { path = "../library-protocol" }
collagene-library-sharing = { path = "../library-sharing" }
collagene-library-sync = { path = "../library-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "=2.5.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
collagene-design-exchange = { path = "../design-exchange" }
collagene-library-host = { path = "../library-host" }
