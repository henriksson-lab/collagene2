[package]
name = "collagene-design-exchange"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Bounded independently implemented SBOL 3.1 structural JSON-LD exchange"
[dependencies]
collagene-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
[features]
default = []
json-schema = ["dep:schemars", "collagene-model/json-schema"]
[dependencies.schemars]
version = "1.2"
optional = true
