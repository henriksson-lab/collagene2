[package]
name = "collagene-desktop-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Framework-independent native desktop host for bounded Collagene IPC"
[dependencies]
collagene-core = { path = "../core" }
collagene-desktop-protocol = { path = "../desktop-protocol" }
collagene-repository = { path = "../repository" }
collagene-lab-library = { path = "../lab-library" }
collagene-library-protocol = { path = "../library-protocol" }
collagene-library-sync = { path = "../library-sync" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
