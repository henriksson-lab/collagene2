[package]
name = "collagene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
collagene-structures = { path = "../structures" }
collagene-protocol-units = { path = "../protocol-units", features = ["serde"] }
collagene-genomic-index = { path = "../genomic-index" }
collagene-model = { path = "../model" }
collagene-read-alignments = { path = "../read-alignments" }
collagene-variants = { path = "../variants" }
collagene-topo = { path = "../topo" }
collagene-recombination = { path = "../recombination" }
collagene-enzyme-catalog = { path = "../enzyme-catalog" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
postcard.workspace = true
gb-io = "0.9"
roxmltree = "=0.21.2"
base64 = "0.22"
pdf-writer = "=0.15.0"
ttf-parser = "=0.25.1"
csv = "=1.4.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
json-schema = ["dep:schemars", "collagene-model/json-schema", "collagene-recombination/json-schema", "collagene-topo/json-schema"]

[dependencies.schemars]
version = "1.2"
optional = true
