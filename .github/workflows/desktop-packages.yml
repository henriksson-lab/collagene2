name: Desktop packages (unsigned)

on:
  workflow_call:
    inputs:
      build_profile:
        description: Native Cargo profile
        required: false
        default: development
        type: string
      frontend_artifact:
        description: Exact same-run frontend artifact; empty builds it once here
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      build_profile:
        description: Native build profile (development is faster; release for delivery candidates)
        required: true
        default: development
        type: choice
        options:
          - development
          - release

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}-${{ inputs.build_profile }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  NO_COLOR: "true"

jobs:
  frontend:
    if: ${{ inputs.frontend_artifact == '' }}
    name: Fresh offline desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-frontend
      - name: Install pinned prebuilt frontend tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14,wasm-bindgen-cli@0.2.128
          fallback: none
          checksum: true
      # The post-build hook is cargo --offline. Populate locked metadata for
      # every target before running it, and compile its native helper once.
      - run: cargo fetch --locked
      - run: cargo build --locked -p collagene-web-assets
      - name: Build current main frontend and current worker
        run: |
          rm -rf dist
          trunk build --locked true --offline true --skip-version-check
      - name: Bound the fresh artifact before uploading
        shell: python
        run: |
          from pathlib import Path
          import stat
          root = Path("dist")
          if not (root / "index.html").is_file():
              raise SystemExit("missing frontend index")
          count = total = 0
          for path in root.rglob("*"):
              info = path.lstat()
              if stat.S_ISLNK(info.st_mode):
                  raise SystemExit("frontend symlinks forbidden")
              if len(path.relative_to(root).parts) > 16:
                  raise SystemExit("frontend depth limit")
              if stat.S_ISREG(info.st_mode):
                  count += 1
                  total += info.st_size
                  if info.st_size > 128 * 1024 * 1024:
                      raise SystemExit("frontend file exceeds 128 MiB")
              elif not stat.S_ISDIR(info.st_mode):
                  raise SystemExit("frontend special files forbidden")
          if count > 512 or total > 256 * 1024 * 1024:
              raise SystemExit("frontend artifact exceeds snapshot limits")
          workers = root / "workers"
          if not workers.is_dir() or len(list(workers.iterdir())) != 1:
              raise SystemExit("expected exactly one current worker bundle")
          print(f"Fresh frontend: {count} files, {total} bytes")
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-package-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Unsigned / ${{ matrix.os }} / ${{ inputs.build_profile }}
    needs: frontend
    if: ${{ !cancelled() && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: ""
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-packages-${{ inputs.build_profile }}
          cache-on-failure: true
      - name: Install Linux build and packaging prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_desktop_deps.sh package
      - name: Install pinned upstream cargo-tauri binary (no source fallback)
        shell: python
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          from pathlib import Path
          import hashlib, io, os, platform, stat, tarfile, urllib.request, zipfile
          # SHA256 values from the official tauri-cli-v2.11.3 release assets.
          archives = {
              ("Linux", "X64"): ("x86_64-unknown-linux-gnu.tgz", "56ebe242d3cab6747dea41b47cdabace47fbea86d65c796f34a95d620d3bad1d"),
              ("Windows", "X64"): ("x86_64-pc-windows-msvc.zip", "a172fa09b791fa885739d252e0ba8b29d0b426fc0c4e3414158308d2da8976f8"),
              ("Darwin", "ARM64"): ("aarch64-apple-darwin.zip", "69716bda20d50e9d3bbbe9797fe303dd55aef903c1aba19731b7355d4fd546b0"),
              ("Darwin", "X64"): ("x86_64-apple-darwin.zip", "9bde55fe15646f1c814eed9ee25da52a79d2c0371ad75ccdb9abf74e93e64069"),
          }
          archive, checksum = archives[(platform.system(), os.environ["RUNNER_ARCH"])]
          url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.3/cargo-tauri-" + archive
          with urllib.request.urlopen(url, timeout=120) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          if len(data) > 32 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != checksum:
              raise SystemExit("cargo-tauri archive limit/checksum mismatch")
          name = "cargo-tauri.exe" if platform.system() == "Windows" else "cargo-tauri"
          if archive.endswith(".zip"):
              with zipfile.ZipFile(io.BytesIO(data)) as bundle:
                  members = [m for m in bundle.infolist() if Path(m.filename).name == name and not m.is_dir()]
                  if len(members) != 1 or members[0].file_size > 64 * 1024 * 1024:
                      raise SystemExit("unexpected cargo-tauri archive layout")
                  binary = bundle.read(members[0])
          else:
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as bundle:
                  members = [m for m in bundle.getmembers() if Path(m.name).name == name and m.isfile()]
                  if len(members) != 1 or members[0].size > 64 * 1024 * 1024:
                      raise SystemExit("unexpected cargo-tauri archive layout")
                  binary = bundle.extractfile(members[0]).read()
          target = Path(os.environ["RUNNER_TEMP"]) / "collagene-tauri-cli"
          target.mkdir()
          executable = target / name
          executable.write_bytes(binary)
          executable.chmod(executable.stat().st_mode | stat.S_IXUSR)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(target) + "\n")
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend_artifact || format('desktop-package-frontend-{0}', github.sha) }}
          path: dist
      - name: Generate platform icon layers from the existing application icon
        working-directory: crates/desktop
        run: cargo tauri icon icons/icon.png --output icons
      - name: Build the requested portable executable or unsigned packages
        shell: python
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          from pathlib import Path
          import os, platform, shutil, subprocess
          profile = os.environ["BUILD_PROFILE"]
          if profile not in {"development", "release"}:
              raise SystemExit("unsupported build profile")
          cargo_profile = "debug" if profile == "development" else "release"
          command = ["cargo", "tauri", "build", "--ci", "--no-sign", "--config", "tauri.package.conf.json"]
          environment = os.environ.copy()
          if platform.system() == "Windows":
              # Explicit target keeps static CRT flags off host proc macros.
              target = "x86_64-pc-windows-msvc"
              command += ["--target", target, "--no-bundle"]
              environment["CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS"] = "-C target-feature=+crt-static"
              environment["STATIC_VCRUNTIME"] = "true"
              output = Path("target") / target / cargo_profile
          else:
              command += ["--bundles", os.environ["BUNDLES"]]
              output = Path("target") / cargo_profile
          # Cached bundle files from a different commit must not become artifacts.
          bundle = output / "bundle"
          if bundle.is_symlink():
              raise SystemExit("cached bundle directory cannot be a symlink")
          if bundle.exists():
              shutil.rmtree(bundle)
          if profile == "development":
              command.append("--debug")
          command += ["--", "--locked"]
          subprocess.run(command, cwd="crates/desktop", env=environment, check=True)
      - name: Check actual payloads and stage only requested artifacts
        shell: python
        env:
          BUILD_PROFILE: ${{ inputs.build_profile }}
          SOURCE_REVISION: ${{ github.sha }}
          FRONTEND_ARTIFACT: ${{ inputs.frontend_artifact || format('desktop-package-frontend-{0}', github.sha) }}
        run: |
          import os, subprocess, sys
          subprocess.run([
              sys.executable, "scripts/stage_desktop_packages.py",
              "--profile", os.environ["BUILD_PROFILE"],
              "--source-revision", os.environ["SOURCE_REVISION"],
              "--frontend-artifact", os.environ["FRONTEND_ARTIFACT"],
          ], check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-packages-unsigned-${{ matrix.os }}-${{ inputs.build_profile }}-${{ github.sha }}
          path: desktop-packages/
          if-no-files-found: error
          retention-days: 7
