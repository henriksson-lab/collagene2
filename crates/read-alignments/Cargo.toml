[package]
name = "collagene-read-alignments"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded loss-explicit SAM/BAM exchange and reported-coordinate projection"


[dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.5"
blake3.workspace = true

noodles-sam = { version = "=0.84.0", optional = true }
noodles-bam = { version = "=0.88.0", optional = true }

[features]
default = []
interop-tests = ["dep:noodles-sam", "dep:noodles-bam"]
