[package]
name = "collagene-variants"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded immutable VCF/BCF declared-evidence exchange"

[dependencies]
noodles-vcf = { version = "=0.87.0", default-features = false }
noodles-bcf = { version = "=0.85.0", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure", "std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.5"
