name: Check
on: [push, pull_request]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Let long Windows checks finish on main; retain the latest pending batch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Keep the native test binaries within hosted-runner disk budgets.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scientific-core:
    name: Scientific core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Report all selected native test failures in one run.
      - run: cargo test -p collagene-genomic-index -p collagene-local-storage -p collagene-topo -p collagene-read-alignments -p collagene-variants -p collagene-recombination -p collagene-model -p collagene-structures -p collagene-rna-chemistry -p collagene-protein-liabilities -p collagene-core -p collagene-mcp -p collagene-sources -p collagene-source-gateway -p collagene-web -p collagene-protocol-units -p collagene-enzyme-catalog -p collagene-web-assets -p collagene-lab-library -p collagene-library-protocol -p collagene-library-sharing -p collagene-library-host -p collagene-server -p collagene-library-sync -p collagene-repository -p collagene-desktop-protocol -p collagene-desktop-host -p collagene-desktop-sync-protocol -p collagene-desktop-sync-host -p collagene-desktop-credentials -p collagene-desktop-mcp -p collagene-design-exchange --features collagene-protocol-units/serde,collagene-rna-chemistry/json-schema,collagene-protein-liabilities/json-schema --locked --no-fail-fast
      - run: cargo test -p collagene-read-alignments --features interop-tests --locked
      - run: cargo build -p collagene-mcp -p collagene-server --locked
      - run: python scripts/mcp_smoke.py
      # Application HTTP checks remain deferred under AGENTS.md.
      - run: python scripts/test_serve_preview.py PreviewBoundary.test_snapshot_stays_read_only_when_disk_changes PreviewBoundary.test_symlinks_are_rejected
      - run: python scripts/test_stage_preview.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: rustc --edition 2024 --test crates/desktop/tests/assets_guard.rs -o "$RUNNER_TEMP/collagene-desktop-assets-guard"
      - run: '"$RUNNER_TEMP/collagene-desktop-assets-guard"'
      - run: cargo check -p collagene-genomic-index -p collagene-topo -p collagene-read-alignments -p collagene-variants -p collagene-recombination -p collagene-model -p collagene-structures -p collagene-rna-chemistry -p collagene-protein-liabilities -p collagene-web -p analysis-worker -p collagene-design-exchange -p collagene-sources -p collagene-source-gateway -p collagene-protocol-units -p collagene-enzyme-catalog -p collagene-library-protocol -p collagene-library-sharing -p collagene-library-sync -p collagene-desktop-protocol -p collagene-desktop-sync-protocol --features collagene-protocol-units/serde,collagene-rna-chemistry/json-schema,collagene-protein-liabilities/json-schema --target wasm32-unknown-unknown --locked
