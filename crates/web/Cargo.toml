[package]
name = "collagene-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
collagene-core = { path = "../core" }
collagene-view-layout = { path = "../view-layout" }
collagene-sources = { path = "../sources" }
serde_json.workspace = true
serde.workspace = true
blake3.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.21", features = ["csr"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "=0.3.105"
futures-channel = "0.3"
web-sys = { version = "=0.3.105", features = ["Selection", "Clipboard", "Navigator", "Window", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "RequestMode", "Response", "Headers", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "Document", "HtmlElement", "CssStyleDeclaration", "Element", "HtmlInputElement", "HtmlTextAreaElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlUniformLocation", "Event", "MouseEvent", "PointerEvent", "WheelEvent", "DomRect", "ResizeObserver", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Storage", "console", "KeyboardEvent", "Worker", "MessageEvent", "DedicatedWorkerGlobalScope", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbKeyRange", "DomException"] }
