[package]
name = "collagene-desktop-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Explicit saved-repository selection for an embedded memory-only MCP session"
[dependencies]
collagene-mcp = { path = "../mcp" }
collagene-desktop-host = { path = "../desktop-host" }
collagene-core = { path = "../core" }
collagene-library-sharing = { path = "../library-sharing" }
collagene-lab-library = { path = "../lab-library" }
serde_json = "1"
thiserror = "2"
[dev-dependencies]
blake3 = "1"
collagene-repository = { path = "../repository" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
