[package]
name = "collagene-lab-library"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
collagene-library-protocol = { path = "../library-protocol" }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
