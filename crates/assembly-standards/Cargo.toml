[package]
name = "collagene-assembly-standards"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Bounded source-pinned declarative assembly-standard grammar and part-format checks"

[dependencies]
collagene-model = { path = "../model" }
collagene-enzyme-catalog = { path = "../enzyme-catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
schemars = { version = "1.2", optional = true }

[features]
json-schema = ["dep:schemars", "collagene-model/json-schema", "collagene-enzyme-catalog/json-schema"]

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
