[package]
autotests = false
name = "collagene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
collagene-image-evidence = { path = "../image-evidence" }
collagene-antibody-numbering = { path = "../antibody-numbering" }
collagene-protein-liabilities = { path = "../protein-liabilities" }
collagene-rna-chemistry = { path = "../rna-chemistry" }
collagene-structures = { path = "../structures" }
collagene-protocol-units = { path = "../protocol-units", features = ["serde"] }
collagene-genomic-index = { path = "../genomic-index" }
collagene-model = { path = "../model" }
collagene-read-alignments = { path = "../read-alignments" }
collagene-variants = { path = "../variants" }
collagene-topo = { path = "../topo" }
collagene-recombination = { path = "../recombination" }
collagene-enzyme-catalog = { path = "../enzyme-catalog" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
postcard.workspace = true
gb-io = "0.9"
roxmltree = "=0.21.2"
base64 = "0.22"
pdf-writer = "=0.15.0"
ttf-parser = "=0.25.1"
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
png = "=0.18.1"
crc32fast = "=1.5.5"
csv = "=1.4.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
json-schema = ["dep:schemars", "collagene-model/json-schema", "collagene-recombination/json-schema", "collagene-topo/json-schema", "collagene-structures/json-schema", "collagene-rna-chemistry/json-schema", "collagene-protein-liabilities/json-schema", "collagene-antibody-numbering/json-schema"]

[dependencies.schemars]
version = "1.2"
optional = true

[[test]]
name = "analysis"
path = "tests/analysis/main.rs"

[[test]]
name = "assembly"
path = "tests/assembly/main.rs"

[[test]]
name = "cloning"
path = "tests/cloning/main.rs"

[[test]]
name = "formats"
path = "tests/formats/main.rs"

[[test]]
name = "history"
path = "tests/history/main.rs"

[[test]]
name = "materials"
path = "tests/materials/main.rs"

[[test]]
name = "restriction"
path = "tests/restriction/main.rs"

[[test]]
name = "sequence"
path = "tests/sequence/main.rs"

[[test]]
name = "verification"
path = "tests/verification/main.rs"
