[package]
name = "collagene-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Offline Tauri desktop shell for the native Collagene repository"
build = "build.rs"

# Root registers the completed desktop graph after native host integration.
[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
collagene-desktop-host = { path = "../desktop-host" }
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.4.3"

[build-dependencies]
tauri-build = "=2.6.3"
