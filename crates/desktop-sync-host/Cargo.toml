[package]
name = "collagene-desktop-sync-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Native saved-repository remote control service for bounded desktop IPC"
[dependencies]
collagene-model = { path = "../model" }
getrandom = "=0.4.3"
collagene-repository = { path = "../repository" }
collagene-desktop-sync-protocol = { path = "../desktop-sync-protocol" }
collagene-desktop-credentials = { path = "../desktop-credentials" }
collagene-library-protocol = { path = "../library-protocol" }
collagene-library-sync = { path = "../library-sync" }
collagene-library-sharing = { path = "../library-sharing" }
collagene-lab-library = { path = "../lab-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
[dev-dependencies]
collagene-core = { path = "../core" }
collagene-library-host = { path = "../library-host" }
