[package]
name = "collagene-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Native same-origin server for an authenticated shared plasmid library"

[dependencies]
collagene-lab-library = { path = "../lab-library" }
collagene-library-protocol = { path = "../library-protocol" }
collagene-library-host = { path = "../library-host" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["net", "rt-multi-thread", "time", "sync", "macros", "signal"] }
subtle = "=2.6.1"
getrandom = "=0.4.3"
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
url = "=2.5.8"
thiserror = "2"

[dev-dependencies]
http-body = "1"
tower = { version = "0.5", features = ["util"] }
collagene-core = { path = "../core", default-features = false }
