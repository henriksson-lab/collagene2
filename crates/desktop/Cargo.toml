[package]
name = "collagene-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Offline Tauri desktop shell for the native Collagene repository"
build = "build.rs"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
collagene-desktop-host = { path = "../desktop-host" }
collagene-desktop-sync-host = { path = "../desktop-sync-host" }
collagene-desktop-sync-protocol = { path = "../desktop-sync-protocol" }
collagene-repository = { path = "../repository" }
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus"] }
# Keep the SDK family matched to tauri2.11.5. Later semver-compatible
# runtime/macros currently generate APIs absent from that exact facade version.
tauri-runtime = { version = "=2.11.3", default-features = false }
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-utils = { version = "=2.9.3", default-features = false }
tauri-macros = { version = "=2.6.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.4.3"

[build-dependencies]
tauri-build = "=2.6.3"
tauri-codegen = { version = "=2.6.3", default-features = false }
tauri-utils = { version = "=2.9.3", default-features = false }
