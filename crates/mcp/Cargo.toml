[package]
autotests = false
name = "collagene-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
collagene-model = { path = "../model" }
collagene-design-exchange = { path = "../design-exchange", features = ["json-schema"] }
collagene-library-sharing = { path = "../library-sharing" }
collagene-local-storage = { path = "../local-storage" }
collagene-core = { path = "../core", features = ["json-schema"] }
collagene-sources = { path = "../sources" }
collagene-protocol-units = { path = "../protocol-units", features = ["serde"] }
collagene-enzyme-catalog = { path = "../enzyme-catalog" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
schemars = "1.2"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.base64]
version = "0.22"

[[test]]
name = "sequence"
path = "tests/sequence/main.rs"

[[test]]
name = "analysis"
path = "tests/analysis/main.rs"

[[test]]
name = "cloning"
path = "tests/cloning/main.rs"

[[test]]
name = "assembly"
path = "tests/assembly/main.rs"

[[test]]
name = "methods"
path = "tests/methods/main.rs"

[[test]]
name = "workspace"
path = "tests/workspace/main.rs"

[[test]]
name = "publication"
path = "tests/publication/main.rs"

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"
